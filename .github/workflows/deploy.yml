name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Move traffic page to secret slug
        env:
          TRAFFIC_SLUG: ${{ secrets.TRAFFIC_SLUG }}
        run: |
          if [ -z "$TRAFFIC_SLUG" ]; then echo "TRAFFIC_SLUG secret is not set"; exit 1; fi
          mv app/traffic "app/$TRAFFIC_SLUG"
      - run: npm run build
        env:
          NEXT_PUBLIC_GMAPS_KEY: ${{ secrets.GMAPS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
